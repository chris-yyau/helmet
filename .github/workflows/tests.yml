name: Tests

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  version-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Check version sync
        run: ./scripts/bump-version.sh --check
      - name: Check template pin + content parity
        run: ./scripts/check-template-pins.sh
      - name: Template-parity self-test (fixtures)
        run: ./scripts/check-template-pins.sh --self-test
      - name: Test required-checks drift detector
        run: ./scripts/test-check-required-checks.sh
      # PyYAML is the fleet scanner-invariants checker's parser dependency — not
      # otherwise a repo/runner dep, so install it explicitly (the checker fails
      # closed with exit 2 if absent). The --self-test is hermetic (no network/gh).
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: pip install --quiet 'pyyaml==6.0.3'  # Pin version — unpinned is a supply chain risk (the parser that validates security workflows)
      - name: Fleet scanner-invariants self-test (fixtures)
        run: ./scripts/check-fleet-scanner-invariants.sh --self-test
      # Hermetic (no network) — proves the pin-staleness extraction/classification logic.
      - name: Pin-staleness self-test (fixtures)
        run: ./scripts/check-pin-staleness.sh --self-test

  commitlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
      # CI-only, exact-pinned (@20.5.0) dev install; repo is deliberately lockfile-less
      - run: npm install --no-save --no-package-lock --no-audit --no-fund @commitlint/cli@20.5.0 @commitlint/config-conventional@20.5.0 # zizmor: ignore[adhoc-packages]
      - name: Lint PR title (squash merge message)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "$PR_TITLE" | npx commitlint
      - name: Lint commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npx commitlint --from "$BASE_SHA" --to "$HEAD_SHA"
